<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Graphify 3D — ARKA cliente</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #0a0a12; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(10, 10, 18, 0.85); color: #e8e8f0;
      padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a4e;
      max-width: 360px; font-size: 13px; line-height: 1.5;
    }
    #hud b { color: #00aaff; }
    #node-info { color: #aaa; margin-top: 6px; display: block; word-break: break-word; }
    #3d-graph { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="hud">
    <b>Grafo 3D</b><br />
    Arrastra = rotar · Scroll = zoom · Click = acercar al nodo<br />
    <span id="node-info">Cargando grafo… (Puede tardar en grafos grandes, puede tardar)</span>
  </div>
  <div id="3d-graph"></div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script>
    const palette = ['#00AAFF','#7EC8E3','#4E79A7','#F28E2B','#E15759','#76B7B2','#59A14F','#B07AA1','#FF9DA7','#9C755F'];

    fetch('graph.json')
      .then((r) => r.json())
      .then((data) => {
        const nodes = data.nodes.map((n) => ({
          id: n.id,
          name: n.label || n.norm_label || n.id,
          community: n.community ?? 0,
          source_file: n.source_file || '',
        }));
        const links = data.links.map((l) => ({ source: l.source, target: l.target }));

        document.getElementById('node-info').textContent =
          `${nodes.length} nodos · ${links.length} conexiones`;

        const el = document.getElementById('3d-graph');
        ForceGraph3D()(el)
          .graphData({ nodes, links })
          .nodeLabel((n) => `${n.name}\n${n.source_file}`)
          .nodeColor((n) => palette[(n.community || 0) % palette.length])
          .nodeVal(1.2)
          .linkWidth(0.2)
          .linkOpacity(0.25)
          .backgroundColor('#0a0a12')
          .onNodeHover((node) => {
            document.getElementById('node-info').textContent = node
              ? `${node.name}\n${node.source_file}`
              : `${nodes.length} nodos · ${links.length} conexiones`;
          })
          .onNodeClick((node) => {
            const dist = 120;
            el.__graph.cameraPosition(
              { x: node.x + dist, y: node.y + dist * 0.4, z: node.z + dist },
              node,
              1200
            );
          });
      })
      .catch(() => {
        document.getElementById('node-info').innerHTML =
          'No se pudo cargar graph.json.<br>Levanta un servidor local:<br><code>python3 -m http.server 8787</code><br>y abre <code>http://localhost:8787/graph-3d.html</code>';
      });
  </script>
</body>
</html>
